<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{rum}} · Panorama</title><link rel="icon" href="data:,">
  <style>
    :root {color-scheme:dark; font:16px "DM Sans",system-ui,sans-serif; background:#17201d; color:#f6f0e6}
    * {box-sizing:border-box} body {margin:0}
    main {width:min(100%,112rem);margin:auto;padding:clamp(.85rem,2vw,2rem)}
    header, nav, footer {display:flex;gap:.5rem 1.1rem;align-items:center;flex-wrap:wrap}
    header {justify-content:space-between;margin-bottom:1rem}
    h1 {font:normal clamp(1.8rem,4vw,3rem) Georgia,serif;margin:0}
    nav a,footer a,button {font:inherit; color:inherit; background:transparent; border:1px solid #6d7b74; padding:.4rem .7rem; border-radius:.35rem; cursor:pointer; text-decoration:none}
    nav a[aria-current="page"] {background:#e1cda9; border-color:#e1cda9; color:#1d2621}
    :focus-visible {outline:2px solid #f2d4a3;outline-offset:2px}
    canvas {display:block; width:100%; height:clamp(15rem,70svh,65rem); background:#242e29; border-radius:.5rem; touch-action:none; cursor:grab}
    canvas:active {cursor:grabbing}
    footer {margin:.65rem 0;color:#d5dbd4}
    #status {margin:0} #status:empty {display:none}
    main:fullscreen {background:#17201d; display:flex; flex-direction:column; height:100%; max-width:none}
    main:fullscreen canvas {height:0;min-height:0;flex:1}
  </style>
  <script type="importmap">{"imports":{"three":"/bordsprov/rum3d/three.module.js","three/addons/":"/bordsprov/rum3d/addons/"}}</script>
</head>
<body>
  <main>
    <header><h1>{{rum}}</h1>
      {{platser}}
      <nav aria-label="Panoramamiljö">
        <a data-room="fotostudio" href="/bordsprov/panorama/fotostudio">Fotostudion</a>
        <a data-room="lounge" href="/bordsprov/panorama/lounge">Loungen</a>
      </nav>
    </header>
    <canvas id="panorama" data-eye="{{blick}}" data-seat="{{plats}}" tabindex="0" aria-label="Se dig omkring i {{rum}}"></canvas>
    <footer aria-label="Blickriktning">
      <button id="left">Vrid åt vänster</button><button id="right">Vrid åt höger</button>
      <button id="reset">Till utgångsvyn</button><button id="full" hidden>Helskärm</button>
      {{golvkontroll}}
      <span>Dra för att se dig omkring.</span>
    </footer>
    <p id="status" role="status">Läser panoramat…</p>
  </main>
  <script>
    document.querySelector('[data-room="{{id}}"]').setAttribute("aria-current","page");
    document.querySelector('[data-seat="{{plats}}"][href]')?.setAttribute("aria-current","page");
    const full = document.getElementById("full");
    if (document.fullscreenEnabled) {
      full.hidden = false;
      full.onclick = async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.querySelector("main").requestFullscreen();
        } catch { document.querySelector("#status").textContent = "Webbläsaren kunde inte öppna helskärmen."; }
      };
      document.addEventListener("fullscreenchange", () => { full.textContent = document.fullscreenElement ? "Lämna helskärm" : "Helskärm"; });
    }
  </script>
  <script type="module" src="/bordsprov/panorama/{{id}}/visare.mjs"></script>
</body>
</html>
