<!doctype html>
<html lang="sv">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kasinorum och kortsko · Ultimate Reality</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ec;color:#21392e;font:16px/1.45 "Segoe UI",Arial,sans-serif}main{max-width:1380px;margin:auto;padding:18px clamp(12px,3vw,40px) 26px}h1{margin:0;font:normal clamp(25px,4vw,38px) Georgia,serif}.toolbar,header,.options{display:flex;gap:8px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}.toolbar{margin:12px 0;gap:12px}.options{gap:4px}button{font:600 14px/1.3 inherit;font-family:inherit;color:inherit;background:#e2e7dd;border:0;border-radius:5px;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{background:#244738;color:white}button:focus-visible{outline:3px solid #b37f36}img{width:100%;height:auto;display:block;background:#333b32;border-radius:7px}p{margin:9px 0}a{color:#246047}label{white-space:nowrap}figure{margin:0}figcaption{margin-top:5px}
</style>
<main>
<header><h1>Kasinorum och kortsko</h1><div class="options" role="group" aria-label="Kamera">
<button data-seat="4">Stol 4</button><button data-seat="1">Stol 1</button><button data-seat="topp">Se skon ovanifrån</button></div></header>
<div class="toolbar">
<div class="options" role="group" aria-label="Rum"><button data-room="kasinorum">Jakobs Kasinorum.glb</button><button data-room="salong">Studions salong</button></div>
<div class="options" role="group" aria-label="Bordsdjup"><button data-depth="108">108 cm</button><button data-depth="96">96 cm</button></div>
<label><input id="body" type="checkbox" checked> Visa Paulinas sittmodell</label>
</div>
<figure><img id="image" width="1600" height="900" alt=""><figcaption id="caption"></figcaption></figure>
<div class="toolbar"><strong>Vrid skon</strong><div class="options" role="group" aria-label="Kortskons riktning">
<button data-angle="-70">Snett mot bordets mitt</button><button data-angle="-45">Mer mot spelaren</button><button data-angle="0">Mot spelaren</button></div></div>
<p><a id="draw" href="/bordsprov/skoprov-v2.html">Tidigare utdragsprov med 110° vridning</a> · <a id="light" href="/bordsprov/ljusprov.html">Jämför med HDRI-fotona</a></p>
</main>
<script type="application/json" id="photos">__PHOTOS__</script>
<script>
const photos = JSON.parse(document.querySelector('#photos').textContent);
const state = {room:'kasinorum',depth:'108',seat:location.pathname.endsWith('/skoprov.html')?'topp':'4',angle:'-70'};
const body = document.getElementById('body');
const image = document.getElementById('image');
body.checked = new URLSearchParams(location.search).get('dealer') !== '0';
function display() {
  for (const key of Object.keys(state)) for (const b of document.querySelectorAll('[data-'+key+']'))
    b.setAttribute('aria-pressed', String(state[key]===b.dataset[key]));
  const camera = state.seat==='topp' ? 'Ovanifrån, dealerns sida uppåt. Pilen visar kortets väg ut.' : 'Stol '+state.seat;
  const room = state.room==='salong' ? 'Studions salong' : 'Jakobs Kasinorum.glb';
  const caption = [room, camera, 'Bordsdjup '+state.depth+' cm', 'Skons vinkel '+state.angle.replace('-','−')+'° från spelarens riktning'].join(' · ');
  image.alt = caption;
  image.src = photos[[state.room,state.depth,Number(body.checked),state.angle,state.seat].join('/')];
  document.getElementById('caption').textContent = caption;
}
for (const key of Object.keys(state)) for (const b of document.querySelectorAll('[data-'+key+']'))
  b.addEventListener('click', () => { state[key]=b.dataset[key]; display(); });
body.addEventListener('change',display);
if(location.protocol==='file:') {
  document.getElementById('draw').href='../../artefakter/kortsko-utdrag-v2/drag-mot-filt/skoprov.html';
  document.getElementById('light').href='../ljusprov-v1/ljusprov.html';
}
display();
</script></html>
